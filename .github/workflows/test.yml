name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI builds: nothing debugs them, and it roughly halves link time and the
  # size of the Rust caches (1.25 GB → restore/save time on every run).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  version_check:
    name: Version + changelog consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The three places a release version lives must agree BEFORE a tag is cut: tauri.conf.json
      # (the bundle/installer version), Cargo.toml (the crate + the update check's "current"), and
      # the CHANGELOG section the release notes come from. build.yml re-checks the tag against them.
      - name: Assert tauri.conf.json == Cargo.toml version and CHANGELOG has a section for it
        shell: bash
        run: |
          set -euo pipefail
          conf=$(jq -r .version widgetsack/tauri.conf.json)
          cargo=$(grep -m1 -E '^version = "' widgetsack/Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          echo "tauri.conf.json: $conf"
          echo "Cargo.toml:      $cargo"
          if [ "$conf" != "$cargo" ]; then
            echo "::error::widgetsack/tauri.conf.json ($conf) and widgetsack/Cargo.toml ($cargo) versions differ"; exit 1
          fi
          if ! grep -qE "^## ${conf//./\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $conf' section"; exit 1
          fi
          echo "OK: $conf"

  rust_test:
    name: Tests for Rust backend
    runs-on: windows-latest
    strategy:
      matrix:
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@v6
      # Tauri embeds client/build at compile time but no Rust test reads it, so a placeholder page
      # stands in for the real frontend build (the client job builds and tests that). Saves the Node
      # setup, npm ci and Vite build here, and keeps frontend changes from invalidating this cache.
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p client/build && echo '<!doctype html>' > client/build/index.html
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # `cargo test` compiles the crate itself; a separate `cargo build` compiled it a second time.
      - run: cargo test

  clippy_check:
    name: Linting for Rust backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p client/build && echo '<!doctype html>' > client/build/index.html
      - uses: Swatinem/rust-cache@v2
      # Same gate as locally (AGENTS.md): tests included, warnings fail the job.
      - run: cargo clippy --all-targets -- -D warnings
    permissions:
      checks: write

  rustfmt_check:
    name: Formatting for Rust backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable && rustup default stable && rustup component add rustfmt
      # Source-only formatting check (no compile / no frontend build needed). Run `cargo fmt` to fix.
      - run: cargo fmt --all --check

  client_test:
    name: Tests and linting for React client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Coverage-gated (replaces plain test:unit): vite.config's ratchet thresholds fail this
      # job on regression, so coverage can never silently drift again (it slid 99.4→97.7
      # unnoticed because CI only ran the tests, never the thresholds).
      - run: npm run test:coverage
      - run: npm run lint
      # Fail if docs/widgets.md drifted from the widget registry (run `npm run gen:docs` to refresh).
      - run: npm run check:docs

  # E2E (Playwright) in its own job so it runs alongside the coverage run instead of after it.
  # It drives the studio in a real browser via the dev Tauri mock. The config's webServer
  # auto-starts `vite` (dev → devMock is active; it's stripped from prod builds), so no separate
  # server step is needed. Browsers must be installed first.
  client_e2e:
    name: E2E tests for React client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Cache the Playwright browser per Playwright version; on a hit only the OS packages install.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
